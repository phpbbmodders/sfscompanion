{# Honeypot decoy fields: moved off screen, so only bots that fill in every field use them #}
{% if S_SFSC_HONEYPOT %}
<p class="hp-field" style="position: absolute; left: -9999px; top: -9999px;" aria-hidden="true">
	<label for="hp_website">{{ lang('SFSC_HP_DECOY_WEBSITE') }}</label>
	<input type="text" name="hp_website" id="hp_website" value="" tabindex="-1" autocomplete="off" />
	<label for="hp_phone">{{ lang('SFSC_HP_DECOY_PHONE') }}</label>
	<input type="text" name="hp_phone" id="hp_phone" value="" tabindex="-1" autocomplete="off" />
</p>
{% endif %}
