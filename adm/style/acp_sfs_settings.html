<!-- INCLUDE overall_header.html -->

<h1>{L_ACP_SFS_SETTINGS}</h1>

<p>{L_ACP_SFS_SETTINGS_EXPLAIN}</p>

<form id="acp_sfs_settings" method="post" action="{U_ACTION}">
	<fieldset>
		<legend>{L_ACP_SFS_SETTINGS}</legend>
		<dl>
			<dt><label for="sfsc_expire_days">{L_SFSC_EXPIRE_DAYS}:</label><br /><span>{L_SFSC_EXPIRE_DAYS_EXPLAIN}</span></dt>
			<dd><input type="number" min="0" max="9999" id="sfsc_expire_days" name="sfsc_expire_days" value="{SFSC_EXPIRE_DAYS}" /> {L_DAYS}</dd>
		</dl>

		{S_FORM_TOKEN}
		<p class="submit-buttons">
			<input class="button1" type="submit" id="submit" name="submit" value="{L_SUBMIT}" />
		</p>
	</fieldset>
</form>

<!-- INCLUDE overall_footer.html -->
